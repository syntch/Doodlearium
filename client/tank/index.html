<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Doodlearium · Tank</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0a3456; }
      canvas { display: block; }
      body.idle { cursor: none; }
      .hint {
        position: fixed; right: 16px; bottom: 12px; color: #fff; opacity: 0.6;
        font: 14px 'Trebuchet MS', sans-serif; pointer-events: none;
        animation: fade 1s 6s forwards;
      }
      @keyframes fade { to { opacity: 0; } }
      #sound {
        position: fixed; right: 16px; top: 12px; font-size: 22px; padding: 4px 10px; border-radius: 999px;
        border: 0; background: rgba(6, 36, 59, 0.55); color: #fff; cursor: pointer; transition: opacity 0.4s;
      }
      body.idle #sound { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div class="hint">Double-click for full screen</div>
    <button id="sound" title="Sound on or off (S)">🔇</button>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
