<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Doodlearium</title>
    <link rel="stylesheet" href="./shared/style.css" />
    <style>
      main { max-width: 760px; margin: 0 auto; padding: 32px 16px; text-align: center; }
      h1 { font-size: clamp(2.2rem, 7vw, 3.6rem); margin: 0.2em 0; }
      p { color: var(--muted); font-size: 1.1rem; }
      .choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-top: 32px; }
      .choices a {
        display: block; padding: 28px 16px; border-radius: var(--radius); background: var(--panel);
        text-decoration: none; color: var(--text); font-size: 1.3rem; font-weight: bold;
        border: 2px solid transparent;
      }
      .choices a:hover { border-color: var(--accent); }
      .choices span { display: block; font-size: 3rem; margin-bottom: 8px; }
      .feed { margin-top: 28px; font-size: 1.2rem; padding: 12px 24px; }
      .choices small { display: block; color: var(--muted); font-weight: normal; font-size: 0.95rem; margin-top: 6px; }
    </style>
  </head>
  <body>
    <main>
      <h1>🐠 Doodlearium</h1>
      <p>The family aquarium where everything is drawn by us.</p>
      <div class="choices">
        <a href="/tank/"><span>🌊</span>Watch the tank<small>Put this on the TV</small></a>
        <a href="/draw/"><span>🖍️</span>Draw something<small>Fish, plants and decorations</small></a>
        <a href="/gallery/"><span>🖼️</span>Gallery<small>Every drawing ever made</small></a>
      </div>
      <p><button class="primary feed" id="feed">🍤 Feed the fish</button></p>
    </main>
    <script type="module">
      import { setupFeedButton } from './shared/api.ts';
      setupFeedButton(document.querySelector('#feed'));
    </script>
  </body>
</html>
